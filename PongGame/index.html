<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pong Game</title>
    <link rel="shortcut icon" href="ping-pong.png" />
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://kit.fontawesome.com/c4ae16c801.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <a class="home" href="../index.html"><i class="fa-solid fa-house"></i></a>
    <h1>Pong Game</h1>
    <div id="settings-block">
      <label for="difficulty">Difficulty:</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <label for="pointsToWin">Points to Win:</label>
      <select id="pointsToWin">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="20">20</option>
      </select>
      <label for="theme">Theme:</label>
      <select
        id="theme"
        onchange="window.applyThemeFromSelect && window.applyThemeFromSelect()"
      >
        <option value="classic" selected>Classic</option>
        <option value="neon">Neon</option>
        <option value="dark">Dark</option>
      </select>
    </div>
    <div id="controls">
      <button id="startBtn">
        <i class="fa-solid fa-play"></i> <span id="startBtnText">Start</span>
      </button>
      <button id="pauseBtn" disabled>
        <i id="pauseIcon" class="fa-solid fa-pause"></i> Pause
      </button>
      <button id="restartBtn">
        <i class="fa-solid fa-rotate-left"></i> Reset
      </button>
    </div>
    <div id="game-layout">
      <div id="score-card-player" class="score-card">
        Player<br /><span id="score-player">0</span>
      </div>
      <div id="game-board-wrapper">
        <div id="winner"></div>
        <canvas id="game" width="600" height="400"></canvas>
      </div>
      <div id="score-card-ai" class="score-card">
        AI<br /><span id="score-ai">0</span>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
